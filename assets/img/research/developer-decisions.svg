<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <title>How developers judge AI-generated code</title>
  <desc>
    A qualitative illustration of findings from developer interviews: people check suggestions by reading and testing, revise them to fit their
    codebase, or reject them.
  </desc>
  <!-- Adapted from the revised study, sections 4.2.3 and 5.1.1:
       https://arxiv.org/html/2503.05012v2 -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#253e3c">
    <text x="40" y="48" font-size="15" letter-spacing="1.5">AI-GENERATED CODE</text>
    <text x="40" y="90" font-family="Georgia, serif" font-size="31">A suggestion still needs judgment.</text>
  </g>
  <rect x="40" y="118" width="560" height="91" rx="2" fill="#f3f7f6" />
  <g stroke-linecap="round" stroke-width="6">
    <path d="M64 141h66 M144 141h146" stroke="#92b5af" />
    <path d="M82 163h131 M229 163h90" stroke="#b9ceca" />
    <path d="M82 185h66 M163 185h205" stroke="#92b5af" />
  </g>
  <g fill="none" stroke="#92b5af" stroke-width="1.5">
    <path d="M320 209v28 M108 237h424 M108 237v28 M320 237v28 M532 237v28" />
  </g>
  <g fill="#176b68">
    <circle cx="108" cy="273" r="3" />
    <circle cx="320" cy="273" r="3" />
    <circle cx="532" cy="273" r="3" />
  </g>
  <g text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#176b68">
    <text x="108" y="319">Check</text>
    <text x="320" y="319">Revise</text>
    <text x="532" y="319">Reject</text>
  </g>
  <g text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#5f6b6a">
    <text x="108" y="352">Read the code.</text>
    <text x="108" y="376">Test the output.</text>
    <text x="320" y="352">Adapt to the</text>
    <text x="320" y="376">existing codebase.</text>
    <text x="532" y="352">Discard what</text>
    <text x="532" y="376">doesn’t fit.</text>
  </g>
</svg>
